<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Requests | Sei Mart Admin</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f3f6f4;color:#17231d;}
.top{background:#17231d;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.top a{color:#e8c65a;text-decoration:none;font-weight:600;}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px 40px;}
.card{background:#fff;border:1px solid #e3e9e4;border-radius:14px;padding:20px;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;}
th{background:#f5f7f5;}
.btn{border:none;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer;margin:2px;}
.ok{background:#3f8c5a;color:#fff;}
.no{background:#d9534f;color:#fff;}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:12px;font-weight:700;background:#eaf2ed;color:#3f6f5a;}
</style>
</head>
<body>
<div class="top">
  <strong>🏪 Seller Requests</strong>
  <div><a href="../admin.html">← Back to Admin</a> · <a href="../sell-with-seimart.html" target="_blank">Public form</a></div>
</div>
<div class="wrap">
  <div class="card">
    <h2 style="margin-top:0;">Sell with Sei Mart — Applications</h2>
    <p style="color:#7b877f;">Requests submitted from the public seller form appear here.</p>
    <div id="list"></div>
  </div>
</div>
<script>
function getList(){ try{return JSON.parse(localStorage.getItem("seiMartSellerApplications")||"[]");}catch(e){return[];} }
function saveList(l){ localStorage.setItem("seiMartSellerApplications", JSON.stringify(l||[])); }
function pushNotif(n){
  try{
    var list=JSON.parse(localStorage.getItem("seiMartAdminNotifications")||"[]");
    list.unshift(n);
    localStorage.setItem("seiMartAdminNotifications", JSON.stringify(list.slice(0,100)));
  }catch(e){}
}
function render(){
  var list=getList();
  var el=document.getElementById("list");
  if(!list.length){ el.innerHTML="<p style='color:#999;padding:20px 0;'>No seller requests yet. Submit one from sell-with-seimart.html</p>"; return; }
  el.innerHTML='<table><thead><tr><th>Shop</th><th>Contact</th><th>Category</th><th>About</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>'+
    list.map(function(s,i){
      return '<tr><td><strong>'+esc(s.shop)+'</strong></td><td>'+esc(s.name)+'<br><small>'+esc(s.phone)+'<br>'+esc(s.email)+'</small></td><td>'+esc(s.category)+'</td><td style="max-width:220px;font-size:13px;">'+esc(s.about||"-")+'</td><td>'+esc(s.date||"-")+'</td><td><span class="badge">'+esc(s.status||"Pending")+'</span></td><td><button class="btn ok" onclick="setStatus('+i+',\'Approved\')">Approve</button><button class="btn no" onclick="setStatus('+i+',\'Rejected\')">Reject</button></td></tr>';
    }).join("")+"</tbody></table>";
}
function esc(v){ return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function setStatus(i,status){
  var list=getList(); if(!list[i]) return;
  list[i].status=status; list[i].updatedAt=new Date().toISOString();
  saveList(list);
  var staff=null; try{staff=JSON.parse(localStorage.getItem("seiMartCurrentStaff")||"null");}catch(e){}
  pushNotif({ id:"N"+Date.now(), to:"superadmin", from: staff?staff.username:"admin", title:"Seller request "+status, body:(list[i].shop||"")+" — "+(list[i].name||""), at:new Date().toISOString(), label:new Date().toLocaleString("en-BD") });
  render();
}
render();
</script>
</body>
</html>
