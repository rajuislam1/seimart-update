<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking | Sei Mart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .track-page { max-width: 720px; margin: 40px auto; padding: 0 20px 60px; }
        .track-card {
            background: #fff;
            border: 1px solid #e2e2e2;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .track-card h1 { font-size: 26px; color: #17231d; margin-bottom: 8px; }
        .track-card > p { color: #7b877f; margin-bottom: 24px; }
        .track-form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
        .track-form input {
            flex: 1; min-width: 200px; padding: 12px 14px;
            border: 1px solid #ddd; border-radius: 8px; font-size: 15px;
        }
        .track-form button {
            background: #3f6f5a; color: #fff; border: none;
            padding: 12px 22px; border-radius: 8px; font-weight: 600;
            cursor: pointer;
        }
        .track-form button:hover { background: #315744; }
        .track-error { color: #d9534f; margin-top: 10px; display: none; }
        .track-result { margin-top: 28px; display: none; }
        .track-meta {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            background: #f5f7f5; border-radius: 10px; padding: 16px; margin-bottom: 20px;
        }
        .track-meta div strong { display: block; font-size: 12px; color: #7b877f; margin-bottom: 4px; }
        .status-badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px;
            background: #eaf2ed; color: #3f6f5a; font-weight: 600; font-size: 13px;
        }
        .status-badge.cancelled { background: #fdeceb; color: #d9534f; }
        .status-badge.delivered { background: #e9f6ed; color: #3f8c5a; }
        .status-badge.shipped { background: #fff5df; color: #d89b20; }
        @media (max-width: 600px) {
            .track-meta { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;">
            <a href="index.html" style="text-decoration:none;color:#3f6f5a;font-weight:700;font-size:20px;">Sei Mart</a>
            <div>
                <a href="products.html" style="margin-right:14px;text-decoration:none;color:#333;">Products</a>
                <a href="account.html" style="margin-right:14px;text-decoration:none;color:#333;">Account</a>
                <a href="order-tracking.html" style="text-decoration:none;color:#3f6f5a;font-weight:600;">Track Order</a>
            </div>
        </div>
    </div>
</header>

<main class="track-page">
    <div class="track-card">
        <h1>Track Your Order</h1>
        <p>Enter your Order ID to see live status and timeline.</p>

        <div class="track-form">
            <input type="text" id="trackOrderId" placeholder="e.g. SM12345678" autocomplete="off">
            <button type="button" id="trackBtn">Track</button>
        </div>
        <div class="track-error" id="trackError">Order not found. Please check your Order ID.</div>

        <div class="track-result" id="trackResult">
            <div class="track-meta" id="trackMeta"></div>
            <div id="trackCourierBox"></div>
            <h3 style="margin-bottom:8px;color:#17231d;">Status Timeline</h3>
            <div id="trackTimeline"></div>
            <div id="trackItems" style="margin-top:20px;"></div>
        </div>
    </div>
</main>

<script src="script.js"></script>
<script>
(function () {
    function badgeClass(status) {
        status = (typeof normalizeOrderStatus === "function") ? normalizeOrderStatus(status) : status;
        if (status === "Cancelled") return "status-badge cancelled";
        if (status === "Delivered") return "status-badge delivered";
        if (status === "Shipped") return "status-badge shipped";
        return "status-badge";
    }

    function track() {
        var id = (document.getElementById("trackOrderId").value || "").trim();
        var err = document.getElementById("trackError");
        var result = document.getElementById("trackResult");
        err.style.display = "none";
        result.style.display = "none";

        if (!id) {
            err.textContent = "Please enter an Order ID.";
            err.style.display = "block";
            return;
        }

        var order = (typeof findOrderById === "function") ? findOrderById(id) : null;
        if (!order) {
            try {
                var all = JSON.parse(localStorage.getItem("seiMartOrders") || "[]");
                order = (all || []).find(function (o) { return String(o.orderId).toLowerCase() === id.toLowerCase(); });
            } catch (e) {}
        }

        if (!order) {
            err.textContent = "Order not found. Please check your Order ID.";
            err.style.display = "block";
            return;
        }

        if (typeof ensureOrderStatusHistory === "function") {
            order = ensureOrderStatusHistory(order);
        }

        var customer = order.customer || {};
        var status = order.status || "Order Placed";
        document.getElementById("trackMeta").innerHTML =
            "<div><strong>Order ID</strong>" + (order.orderId || "-") + "</div>" +
            "<div><strong>Status</strong><span class=\"" + badgeClass(status) + "\">" + status + "</span></div>" +
            "<div><strong>Date</strong>" + (order.date || order.createdAt || "-") + "</div>" +
            "<div><strong>Total</strong>৳" + Number(order.total || 0).toLocaleString("en-BD") + "</div>" +
            "<div><strong>Customer</strong>" + (customer.name || order.customerName || "-") + "</div>" +
            "<div><strong>Payment</strong>" + (order.paymentMethod || "-") + " · " + (order.paymentStatus || "-") + "</div>" +
            "<div><strong>Courier</strong>" + (order.courier || (/steadfast|cash on delivery/i.test(order.paymentMethod || "") ? "Steadfast" : "—")) + "</div>" +
            "<div><strong>Tracking ID</strong>" + (order.trackingId || order.consignmentId || "Not assigned yet") + "</div>";

        var courierBox = document.getElementById("trackCourierBox");
        if (!courierBox) {
            courierBox = document.createElement("div");
            courierBox.id = "trackCourierBox";
            var timelineEl = document.getElementById("trackTimeline");
            if (timelineEl && timelineEl.parentNode) timelineEl.parentNode.insertBefore(courierBox, timelineEl);
            else result.appendChild(courierBox);
        }
        var tid = order.trackingId || order.consignmentId || "";
        var cour = order.courier || (/steadfast|cash on delivery/i.test(order.paymentMethod || "") ? "Steadfast" : "");
        courierBox.style.cssText = "margin:16px 0;padding:16px;background:#f0f7f3;border:1px solid #c5ddd0;border-radius:12px;";
        if (tid) {
            courierBox.innerHTML = "<div style='font-weight:700;color:#17231d;margin-bottom:8px;'>Courier Tracking</div>" +
                "<div style='font-size:14px;color:#315744;line-height:1.6;'>" +
                "<div><strong>Courier:</strong> " + cour + "</div>" +
                "<div><strong>Tracking / Consignment ID:</strong> <code style='background:#fff;padding:2px 8px;border-radius:4px;'>" + tid + "</code></div>" +
                (order.courierNote ? ("<div><strong>Note:</strong> " + String(order.courierNote).replace(/</g,"") + "</div>") : "") +
                (/steadfast/i.test(cour) ? "<div style='margin-top:10px;'><a href='https://steadfast.com.bd/' target='_blank' rel='noopener' style='color:#3f6f5a;font-weight:700;'>Open Steadfast website</a></div>" : "") +
                "</div>";
        } else {
            courierBox.innerHTML = "<div style='font-weight:700;color:#17231d;margin-bottom:6px;'>Courier Tracking</div>" +
                "<p style='margin:0;font-size:14px;color:#7b877f;'>Tracking ID will appear here after the parcel is booked with " + (cour || "courier") + ".</p>";
        }

        document.getElementById("trackTimeline").innerHTML =
            (typeof buildStatusTimelineHTML === "function") ? buildStatusTimelineHTML(order) : "";

        var items = order.items || [];
        if (items.length) {
            var rows = items.map(function (it) {
                return "<tr><td style='padding:8px;border-bottom:1px solid #eee;'>" + (it.name || "Product") +
                    "</td><td style='padding:8px;border-bottom:1px solid #eee;text-align:center;'>" + (it.quantity || 1) +
                    "</td><td style='padding:8px;border-bottom:1px solid #eee;text-align:right;'>৳" +
                    Number(it.price || 0).toLocaleString("en-BD") + "</td></tr>";
            }).join("");
            document.getElementById("trackItems").innerHTML =
                "<h3 style='margin-bottom:8px;'>Items</h3>" +
                "<table style='width:100%;border-collapse:collapse;font-size:14px;'>" +
                "<thead><tr><th style='text-align:left;padding:8px;'>Product</th><th>Qty</th><th style='text-align:right;padding:8px;'>Price</th></tr></thead>" +
                "<tbody>" + rows + "</tbody></table>";
        } else {
            document.getElementById("trackItems").innerHTML = "";
        }

        result.style.display = "block";
    }

    document.getElementById("trackBtn").addEventListener("click", track);
    document.getElementById("trackOrderId").addEventListener("keydown", function (e) {
        if (e.key === "Enter") track();
    });

    // Prefill from URL ?id=
    var params = new URLSearchParams(window.location.search);
    var qid = params.get("id") || params.get("order");
    if (qid) {
        document.getElementById("trackOrderId").value = qid;
        track();
    }
})();
</script>
</body>
</html>
